services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: profia-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./backend/storage/uploads:/app/storage/uploads
      - ./hf_model:/app/modelo_local

    restart: unless-stopped
    networks:
      - profia-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: profia-backend
    ports:
      - "8000:8000"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/storage/uploads:/app/storage/uploads
      - /home/rjra/projetos/profia-recuperado/backend/hf_model:/app/modelo_local
    depends_on:
      - qdrant
    restart: unless-stopped
    networks:
      - profia-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: profia-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://192.168.42.69:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - profia-network

networks:
  profia-network:
    driver: bridge
